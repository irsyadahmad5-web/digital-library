<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2563EB">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Offline · Digital Library</title>
    <style>
        * { box-sizing: border-box; }
        html {
            min-height: 100%;
            background: #f8fafc;
            color: #0f172a;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }
        main {
            width: min(100%, 440px);
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            background: #fff;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .08);
        }
        .icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 800;
        }
        h1 {
            margin: 20px 0 0;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: -.03em;
        }
        p {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }
        button {
            margin-top: 22px;
            min-height: 46px;
            width: 100%;
            border: 0;
            border-radius: 14px;
            background: #0f172a;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">DL</div>
        <h1>Koneksi internet tidak tersedia.</h1>
        <p>
            Digital Library tetap terpasang, tetapi katalog terbaru dan file PDF
            membutuhkan koneksi internet. Sambungkan perangkat lalu coba lagi.
        </p>
        <form action="/" method="get">
            <button type="submit">Coba lagi</button>
        </form>
    </main>
</body>
</html>
